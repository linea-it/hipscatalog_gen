repos:
  # Compare the local template version to the latest remote template version
  # This hook should always pass. It will print a message if the local version is out of date.
  - repo: https://github.com/lincc-frameworks/pre-commit-hooks
    rev: v0.2.2
    hooks:
      - id: check-lincc-frameworks-template-version
        name: Check template version
        description: Compare current template version against latest
        verbose: true

  # Clear output from Jupyter notebooks so that only the input cells are committed.
  - repo: local
    hooks:
      - id: jupyter-nb-clear-output
        name: Clear output from Jupyter notebooks
        description: Clear output from Jupyter notebooks.
        files: \.ipynb$
        exclude: ^docs/pre_executed
        stages: [pre-commit]
        language: system
        entry: jupyter nbconvert --clear-output

  # Prevents committing directly to branches named 'main' and 'master'.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: Check merge conflicts
        description: Ensure merge conflict markers are not committed.

      - id: detect-private-key
        name: Detect private keys
        description: Prevent committing private keys.

      - id: no-commit-to-branch
        name: Prevent main branch commits
        description: Prevent the user from committing directly to the primary branch.

      - id: check-added-large-files
        name: Check for large files
        description: Prevent the user from committing very large files.
        exclude: |
          (?x)^(
            examples/data/.*  # ignore sample datasets
          )$
        args: ['--maxkb=500']

      - id: end-of-file-fixer
        exclude: ^docs/reference/generated/
      - id: trailing-whitespace
        name: Fix trailing whitespace
        description: Remove trailing whitespace from files.
        exclude: ^docs/reference/generated/
      - id: check-yaml
        name: Check YAML
        description: Validate YAML files.
      - id: check-json
        name: Check JSON
        description: Validate JSON files.
      - id: check-toml
        name: Check TOML
        description: Validate TOML files.

  # Comprehensive secrets scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: gitleaks (secrets scan)
        description: Scan for secrets using gitleaks ruleset.
        args: ["--redact"]
        pass_filenames: false

  # Verify that pyproject.toml is well formed
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject
        name: Validate pyproject.toml
        description: Verify that pyproject.toml adheres to the established schema.

  # Verify that GitHub workflows are well formed
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.36.0
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]

  # Lint code using ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: Lint code using ruff; sort and organize imports
        types_or: [python, pyi]
        args: ["--fix"]

  # Format code using ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-format
        name: Format code using ruff
        types_or: [python, pyi, jupyter]

  # Analyze type hints and report errors
  - repo: local
    hooks:
      - id: mypy
        name: mypy (python files in src/)
        entry: mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
        args:
          [
            "--ignore-missing-imports", # Ignore imports without type hints
            "src",
          ]

  # Make sure Sphinx can build the documentation (notebooks excluded)
  - repo: local
    hooks:
      - id: sphinx-build
        name: Build documentation with Sphinx
        entry: bash -c 'SPHINX_AUTOSUMMARY=0 sphinx-build -M html ./docs ./_readthedocs -T -E -d ./docs/_build/doctrees'
        language: system
        always_run: true
        exclude_types: [file, symlink]
        pass_filenames: false

  # Run unit tests and generate coverage report
  - repo: https://github.com/lincc-frameworks/pre-commit-hooks
    rev: v0.2.2
    hooks:
      - id: pre-executed-nb-never-execute
        name: Check pre-executed notebooks
        files: ^docs/pre_executed/.*\.ipynb$
        verbose: true
        args:
          ["docs/pre_executed/"]
    # Run unit tests, verify that they pass. Note that coverage is run against
    # the ./src directory here because that is what will be committed. In the
    # github workflow script, the coverage is run against the installed package
    # and uploaded to Codecov by calling pytest like so:
    # `python -m pytest --cov=<package_name> --cov-report=xml`
  - repo: local
    hooks:
      - id: pytest-check
        name: Run unit tests
        description: Run unit tests with pytest.
        entry: bash -c "if python -m pytest --co -qq; then python -m pytest --cov=./src --cov-report=html --cov-fail-under=80; fi"
        language: system
        pass_filenames: false
        always_run: true
