
# This workflow will install Python dependencies, run tests and report code coverage with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit test and code coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        uv pip install --system -e .[dev]
        if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi
    - name: Run unit tests with pytest
      run: |
        python -m pytest --cov=hipscatalog_gen --cov-report=xml --cov-fail-under=80
    - name: Upload coverage report to codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: false
  test-lowest-versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        sudo apt-get update
        python -m pip install --upgrade uv
        uv venv venv
        source venv/bin/activate
        if [ -f requirements.txt ]; then
          uv pip compile --resolution=lowest-direct pyproject.toml requirements.txt -o requirements_lowest.txt
        else
          uv pip compile --resolution=lowest-direct pyproject.toml -o requirements_lowest.txt
        fi
        uv pip install --constraint=requirements_lowest.txt -e .[dev]
    - name: Run unit tests with pytest
      run: |
        source venv/bin/activate
        python -m pytest

  pip-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install project and pip-audit
      run: |
        sudo apt-get update
        uv pip install --system .[dev] pip-audit
    - name: Upgrade pip (fix CVE-2026-1703)
      run: |
        python -m pip install --upgrade "pip>=26.0"
    - name: Run pip-audit
      run: |
        pip-audit --progress-spinner off --desc --ignore-vuln CVE-2025-53000
